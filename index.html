<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Soma</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Verificador de Soma</h1>

        <form id="soma-form">
            <input type="number" id="num1" placeholder="Digite o primeiro número" required>
            <input type="number" id="num2" placeholder="Digite o segundo número" required>
            <input type="number" id="num3" placeholder="Digite o terceiro número" required>
            <button type="submit">Verificar</button>
        </form>

        <p id="mensagem" class="mensagem"></p>
    </div>

    <script src="./script.js"></script>
</body>
</html>
